quarkus.application.name=svc-import-export
quarkus.http.port=${HTTP_PORT:8097}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${JDBC_URL:jdbc:postgresql://localhost:5432/pethub}
quarkus.datasource.username=${DB_USERNAME:pethub}
quarkus.datasource.password=${DB_PASSWORD:pethub}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX:10}
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.always-include=${SWAGGER_ENABLED:false}
quarkus.health.extensions.enabled=true
quarkus.log.console.json=true
quarkus.log.console.json.additional-field.service.value=svc-import-export
quarkus.http.limits.max-body-size=${IMPORT_MAX_BODY:10485760}
import-export.max-bytes=${IMPORT_MAX_BYTES:10485760}
import-export.max-rows=${IMPORT_MAX_ROWS:100000}
import-export.max-preview-rows=${IMPORT_MAX_PREVIEW_ROWS:1000}
import-export.upload-signing-key=${IMPORT_UPLOAD_SIGNING_KEY:local-e06-test-key}
import-export.download-ttl=${IMPORT_DOWNLOAD_TTL:PT30M}
import-export.require-antivirus=${IMPORT_REQUIRE_ANTIVIRUS:true}
